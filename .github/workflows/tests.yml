name: CI Test Workflow

on:
  push:
    branches:
      - main
  pull_request: 
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      ENV: test
      CIPHER_KEY: ${{ vars.CIPHER_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Init DB
        run: |
          python ./src/database_utils/init_db.py

      - name: Run unit tests
        run: |
          pytest tests/unit_tests -v

  integration-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      ENV: test
      CIPHER_KEY: ${{ vars.CIPHER_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Init DB
        run: |
          python ./src/database_utils/init_db.py

      - name: Run integration tests
        run: |
          pytest tests/integration_tests -v

  smoke-e2e-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      ENV: test
      CIPHER_KEY: ${{ vars.CIPHER_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Init DB
        run: |
          python ./src/database_utils/init_db.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node.js dependencies
        run: cd tests/e2e_smoke_tests && npm ci

      - name: Install Playwright browsers
        run: cd tests/e2e_smoke_tests && npx playwright install --with-deps

      - name: Start web-app
        run: |
          python -m uvicorn web_app.main:app --host 0.0.0.0 --port 8000 &
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/", timeout=1):
                      break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("web app did not become ready on port 8000")
          PY

      - name: Run Playwright tests
        run: cd tests/e2e_smoke_tests && npm run build && npm run test:playwright
