{% extends 'base.html' %}

{% block content %}

<div class="container text-center">
    <form>
        <div class="row mx-3 mt-3">
            <h5>Submit new search for car of your dreams!</h5>
        </div>
        <div class="row mx-3">
            <select class="form-select my-3" name="manufacturer" id="id-manufacturer">
                <option selected>Select car manufacturer!</option>
                {% for m in car_manufacturers %}
                    <option value="{{ m }}">{{ m }}</option>            
                {% endfor %}
            </select>
        </div>
        <div class="row mx-3">
            <select class="form-select my-3" name="model" id="id-model" disabled="true"> 
                <option selected>Select model!</option>
            </select>
        </div>
        <div class="row mx-3 mb-3">
            <label for="id-attributes" class="form-label">Type here optional attributes</label>
            <textarea class="form-control" id="id-attributes" rows="1" placeholder="S-Line, M paket edition ..."></textarea>
        </div>
        <div class="row mx-3 my-3">
            <label for="id-slider-year" class="form-label">
                <div class="row">
                    <div class="col">
                        Year range: 
                    </div>
                    <div class="col">
                        <input type="number" class="form-control form-control-sm" id="id-input-year-range-from">
                    </div>
                    <div class="col">
                        <input type="number" class="form-control form-control-sm" id="id-input-year-range-to">
                    </div>
                </div>
            </label>
            <div id="id-slider-year"></div>                
        </div>
        <div class="row mx-3 my-3">
            <label for="id-slider-mileage" class="form-label">
                <div class="row">
                    <div class="col">
                        Mileage range (km): 
                    </div>
                    <div class="col">
                        <input type="number" class="form-control form-control-sm" id="id-input-mileage-range-from">
                    </div>
                    <div class="col">
                        <input type="number" class="form-control form-control-sm" id="id-input-mileage-range-to">
                    </div>
                </div>
            </label>
            <div id="id-slider-mileage"></div>
        </div>
        <div class="row mx-3 my-3">
            <label for="id-slider-price" class="form-label">
                <div class="row">
                    <div class="col">
                        Price range (Kč):
                    </div>
                    <div class="col">
                        <input type="number" class="form-control form-control-sm" id="id-input-price-range-from">
                    </div>
                    <div class="col">
                        <input type="number" class="form-control form-control-sm" id="id-input-price-range-to">
                    </div>
                </div>
            </label>
            <div id="id-slider-price"></div>
        </div>
        <div class="row mx-3 my-3">
            <label for="id-psc-code" class="form-label">Enter PSČ</label>
            <textarea class="form-control" id="id-psc-code" rows="1"></textarea>
        </div>
        <div class="row mx-3 my-3">
            <label for="id-km-range" class="form-label">km range from PSČ</label>
            <input type="number" id="id-km-range" class="form-control" min="0" step="5">
        </div>
        <div class="row mx-3 my-3">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>
    </form>
</div>

<script src="{{ url_for('static', path='js/populate_models_field__create_search_form.js') }}"></script>

<script type="module">
    const currentYear = new Date().getFullYear();
    var slider_year = document.getElementById('id-slider-year');
    var input_year_from = document.getElementById('id-input-year-range-from');
    var input_year_to = document.getElementById('id-input-year-range-to');
    var slider_mileage = document.getElementById('id-slider-mileage');
    var input_mileage_from = document.getElementById('id-input-mileage-range-from');
    var input_mileage_to = document.getElementById('id-input-mileage-range-to');
    var slider_price = document.getElementById('id-slider-price');
    var input_price_from = document.getElementById('id-input-price-range-from');
    var input_price_to = document.getElementById('id-input-price-range-to');

    var list_sliders = [slider_year, slider_mileage, slider_price];
    var list_from = [input_year_from, input_mileage_from, input_price_from];
    var list_to = [input_year_to, input_mileage_to, input_price_to];
    var list_show = [[1990, 2010], [50000, 200000], [50000, 100000]];
    var list_range = [[1950, currentYear], [0, 500000], [0, 1000000]]

    function create_slider(slider, show, range, step, input_from, input_to) {
        noUiSlider.create(slider, {
            start: [show[0], show[1]],
            connect: true,
            range: {
                "min": range[0],
                "max": range[1]
            },
            step: step,
            format: {
                to: function (value) {
                    return Math.round(value);
                },
                from: function (value) {
                    return Number(value);
                }
            }
        });
        slider.noUiSlider.on("update", function (values, handle) {
            if (handle === 0) {
                input_from.value = Math.round(values[0])
            } else {
                input_to.value = Math.round(values[1])
            }
        });
        input_from.addEventListener('change', function() {
            slider.noUiSlider.set([this.value, null])
        });
        input_to.addEventListener('change', function() {
            slider.noUiSlider.set([null, this.value])
        });
    }

    list_sliders.forEach((slider, i) => {
        create_slider(slider, list_show[i], list_range[i], 1, list_from[i], list_to[i]);
    })

</script>

{% endblock %}
