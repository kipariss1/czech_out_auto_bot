version: '3.9'

services:
  web_app:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: web_app
    volumes:
      - ./src/db:/app/src/db
    ports:
      - "8000:8000"
    environment:
      - CIPHER_KEY=${CIPHER_KEY}
      - RENDER_EXTERNAL_URL=${RENDER_EXTERNAL_URL}


  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: telegram_bot
    volumes:
      - ./src/db:/app/src/db
    environment:
      - CIPHER_KEY=${CIPHER_KEY}
      - BOT_TOKEN=${BOT_TOKEN}
      - RENDER_EXTERNAL_URL=${RENDER_EXTERNAL_URL}