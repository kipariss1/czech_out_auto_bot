<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/nouislider.min.css') }}">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .header-img {
          max-width: 40px;
        }
      </style>
</head>
<body>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <div class="row d-flex align-items-stretch">
                    <div class="col-4 d-flex justify-content-center align-items-center">
                        <img src="{{ url_for('static', path='pics/logo.jpeg') }}" class="header-img">
                    </div>
                    <div class="col-8 d-flex justify-content-center mt-auto">
                        <h4>Czech out car bot</h4>
                    </div>
                </div>
            </a>
        </div>
    </nav>

    <main id="id-main">
        <div class="alert alert-warning" role="alert" id="id-alert-tab" style="display:none">
            Default text    
        </div>

        <div class="alert alert-success" role="alert" id="id-success-message-tab" style="display:none">
            Default text    
        </div>

        {% block content %}{% endblock %}
    </main>

    <script>
        // Mirrors Python's logging module levels/semantics: a handler only
        // fires when the configured level is low enough to admit it.
        const PY_LOG_LEVELS = { DEBUG: 10, INFO: 20, WARNING: 30, ERROR: 40, CRITICAL: 50 };
        const currentLogLevel = PY_LOG_LEVELS["{{ log_level }}"] ?? PY_LOG_LEVELS.INFO;

        if (currentLogLevel <= PY_LOG_LEVELS.DEBUG) {
            const showDebugError = (label, details) => {
                const tab = document.getElementById('id-alert-tab');
                if (!tab) return;
                tab.innerText = `${label}: ${details}`;
                tab.style.display = "block";
            };

            window.addEventListener('error', (event) => {
                showDebugError(
                    'JS error',
                    `${event.message} @ ${event.filename}:${event.lineno}:${event.colno}\n${event.error?.stack || ''}`
                );
            });

            window.addEventListener('unhandledrejection', (event) => {
                showDebugError('Unhandled rejection', String(event.reason?.stack || event.reason));
            });
        }

        const telegramWebApp = window.Telegram?.WebApp;
        if (telegramWebApp) {
            telegramWebApp.ready();
            telegramWebApp.expand();
        }
    </script>
    <script src="{{ url_for('static', path='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
