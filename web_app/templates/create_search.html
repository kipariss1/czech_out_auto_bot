{% extends 'base.html' %}

{% block content %}

<div class="container text-center" id="id-main-container">
    <form id="id-submit-search-form" method="post">
        <div class="row mx-3 mt-3">
            <h5>Submit new search for car of your dreams!</h5>
        </div>
        <div class="row mx-3">
            <select class="form-select my-3" name="manufacturer" id="id-manufacturer" data-testid="select-manufacturer-input">
                <option selected>Select car manufacturer!</option>
                {% for m in car_manufacturers %}
                    <option value="{{ m }}">{{ m }}</option>            
                {% endfor %}
            </select>
        </div>
        <div class="row mx-3">
            <select class="form-select my-3" name="model" id="id-model" disabled="true" data-testid="select-model-input"> 
                <option selected>Select model!</option>
            </select>
        </div>
        <div class="row mx-3 mb-3" id="id-row-with-attributes">
            <label for="id-attributes-0" class="form-label">Type here optional attributes: </label>
            <div class="row mb-1">
                <div class="col-8">
                    <textarea class="form-control" id="id-attributes-0" n="0" rows="1" placeholder="M paket, 2.0 TDI"></textarea>
                </div>
                <div class="col-2">
                    <button class="btn btn-success" type="button" id="id-attributes-0-submit-btn" n="0">✓</button>
                </div>
            </div>
        </div>
        <div class="row mx-3 my-3">
            <label for="id-slider-year" class="form-label">
                <div class="row">
                    <div class="col-3">
                        Year: 
                    </div>
                    <div class="col-4">
                        <input type="number" class="form-control form-control-sm" id="id-input-year-range-from" name="input_year_range_from">
                    </div>
                    <div class="col-4">
                        <input type="number" class="form-control form-control-sm" id="id-input-year-range-to" name="input_year_range_to">
                    </div>
                </div>
            </label>
            <div id="id-slider-year"></div>                
        </div>
        <div class="row mx-3 my-3">
            <label for="id-slider-mileage" class="form-label">
                <div class="row">
                    <div class="col-3">
                        Mileage (km): 
                    </div>
                    <div class="col-4">
                        <input type="number" class="form-control form-control-sm" id="id-input-mileage-range-from" name="input_mileage_range_from">
                    </div>
                    <div class="col-4">
                        <input type="number" class="form-control form-control-sm" id="id-input-mileage-range-to" name="input_mileage_range_to">
                    </div>
                </div>
            </label>
            <div id="id-slider-mileage"></div>
        </div>
        <div class="row mx-3 my-3">
            <label for="id-slider-price" class="form-label">
                <div class="row">
                    <div class="col-3">
                        Price (Kč):
                    </div>
                    <div class="col-4">
                        <input type="number" class="form-control form-control-sm" id="id-input-price-range-from" name="input_price_range_from">
                    </div>
                    <div class="col-4">
                        <input type="number" class="form-control form-control-sm" id="id-input-price-range-to" name="input_price_range_to">
                    </div>
                </div>
            </label>
            <div id="id-slider-price"></div>
        </div>
        <div class="row mx-3 my-3">
            <label for="id-psc-code" class="form-label">Enter PSČ</label>
            <textarea class="form-control" id="id-psc-code" name="psc_code" rows="1"></textarea>
        </div>
        <div class="row mx-3 my-3">
            <label for="id-psc-km-range" class="form-label">km range from PSČ</label>
            <input type="number" id="id-psc-km-range" name="psc_km_range" class="form-control" min="0" step="5">
        </div>
        <div class="row mx-3 my-3">
            <button type="submit" class="btn btn-primary" data-testid="submit-btn">Submit</button>
        </div>
    </form>
</div>

<script src="{{ url_for('static', path='js/populate_models_field__create_search_form.js') }}"></script>
<script src="{{ url_for('static', path='js/nouislider.min.js') }}"></script>
<script src="{{ url_for('static', path='js/create_sliders__create_search_form.js') }}"></script>
<script src="{{ url_for('static', path='js/create_search.js') }}" type="module"></script>

{% endblock %}
