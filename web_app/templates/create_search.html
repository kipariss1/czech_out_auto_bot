{% extends 'base.html' %}

{% block content %}
<style>
    .form-switch .form-check-input {
        width: 3em;
        height: 1.5em;
        cursor: pointer;
    }
</style>

<div class="container text-center" id="id-main-container">
    <form id="id-submit-search-form" method="post">
        <div class="row mx-3 mt-3">
            <h5>Submit new search for car of your dreams!</h5>
        </div>
        <div class="row mx-3">
            <select class="form-select my-3" name="manufacturer" id="id-manufacturer" data-testid="select-manufacturer-input">
                <option selected>Select car manufacturer!</option>
                {% for m in car_manufacturers %}
                    <option value="{{ m }}">{{ m }}</option>            
                {% endfor %}
            </select>
        </div>
        <div class="row mx-3">
            <select class="form-select my-3" name="model" id="id-model" disabled="true" data-testid="select-model-input"> 
                <option selected>Select model!</option>
            </select>
        </div>
        <div class="row mx-3 my-3">
            <label for="id-slider-year" class="form-label">
                <div class="row">
                    <div class="col-3">
                        Year: 
                    </div>
                    <div class="col-4">
                        <input type="number" class="form-control form-control-sm" id="id-input-year-range-from" data-testid="id-input-year-range-from" name="input_year_range_from">
                    </div>
                    <div class="col-4">
                        <input type="number" class="form-control form-control-sm" id="id-input-year-range-to" data-testid="id-input-year-range-to" name="input_year_range_to">
                    </div>
                </div>
            </label>
            <div id="id-slider-year"></div>                
        </div>
        <div class="row mx-3 my-3">
            <label for="id-slider-mileage" class="form-label">
                <div class="row g-2 align-items-center">
                    <div class="col-12 col-sm-3 text-start">
                        Mileage (km, optional): 
                    </div>
                    <div class="col-5 col-sm-4">
                        <input type="number" class="form-control form-control-sm" id="id-input-mileage-range-from" data-testid="id-input-mileage-range-from" name="input_mileage_range_from" placeholder="Any">
                    </div>
                    <div class="col-5 col-sm-3">
                        <input type="number" class="form-control form-control-sm" id="id-input-mileage-range-to" data-testid="id-input-mileage-range-to" name="input_mileage_range_to" placeholder="Any">
                    </div>
                    <div class="col-2 col-sm-2 d-flex justify-content-end align-items-center pe-0">
                        <div class="form-check form-switch m-0 d-flex align-items-center">
                            <input class="form-check-input mt-0" type="checkbox" role="switch" id="id-enable-mileage-filter" data-testid="id-enable-mileage-filter" aria-label="Enable mileage filter">
                        </div>
                    </div>
                </div>
            </label>
            <div id="id-slider-mileage"></div>
        </div>
        <div class="row mx-3 my-3">
            <label for="id-slider-price" class="form-label">
                <div class="row g-2 align-items-center">
                    <div class="col-12 col-sm-3 text-start">
                        Price (Kč, optional):
                    </div>
                    <div class="col-5 col-sm-4">
                        <input type="number" class="form-control form-control-sm" id="id-input-price-range-from" data-testid="id-input-price-range-from" name="input_price_range_from" placeholder="Any">
                    </div>
                    <div class="col-5 col-sm-3">
                        <input type="number" class="form-control form-control-sm" id="id-input-price-range-to" data-testid="id-input-price-range-to" name="input_price_range_to" placeholder="Any">
                    </div>
                    <div class="col-2 col-sm-2 d-flex justify-content-end align-items-center pe-0">
                        <div class="form-check form-switch m-0 d-flex align-items-center">
                            <input class="form-check-input mt-0" type="checkbox" role="switch" id="id-enable-price-filter" data-testid="id-enable-price-filter" aria-label="Enable price filter">
                        </div>
                    </div>
                </div>
            </label>
            <div id="id-slider-price"></div>
        </div>
        <div class="row mx-3 my-3">
            <div class="d-flex align-items-center justify-content-between gap-3 px-0 pb-2">
                <label for="id-psc-code" class="form-label mb-0">Enter PSČ (optional)</label>
                <div class="form-check form-switch m-0 d-flex align-items-center">
                    <input class="form-check-input mt-0" type="checkbox" role="switch" id="id-enable-psc-filter" data-testid="id-enable-psc-filter" aria-label="Enable PSČ filter">
                </div>
            </div>
            <textarea class="form-control" id="id-psc-code" name="psc_code" rows="1" placeholder="Any location"></textarea>
        </div>
        <div class="row mx-3 my-3">
            <div class="d-flex align-items-center justify-content-between gap-3 px-0 pb-2">
                <label for="id-psc-km-range" class="form-label mb-0">km range from PSČ (optional)</label>
                <div class="form-check form-switch m-0 d-flex align-items-center">
                    <input class="form-check-input mt-0" type="checkbox" role="switch" id="id-enable-psc-km-filter" data-testid="id-enable-psc-km-filter" aria-label="Enable PSČ km range filter">
                </div>
            </div>
            <input type="number" id="id-psc-km-range" name="psc_km_range" class="form-control" min="0" step="5" placeholder="Any">
        </div>
        <div class="row mx-3 my-3">
            <button type="submit" class="btn btn-primary" data-testid="submit-btn">Submit</button>
        </div>
    </form>
</div>

<script src="{{ url_for('static', path='js/populate_models_field__create_search_form.js') }}"></script>
<script src="{{ url_for('static', path='js/nouislider.min.js') }}"></script>
<script src="{{ url_for('static', path='js/create_sliders__create_search_form.js') }}?v=2026-07-06-1"></script>

<script type="module">
    import { show_alert_message } from "../static/js/utils.js"

    var search_form = document.getElementById('id-submit-search-form');

    search_form.addEventListener('submit', validate_search_form);
    function validate_search_form(event) {
        event.preventDefault();
        var form = document.forms[0];
        var manufacturer = form['manufacturer'];
        var model = form['model'];
        var psc_code = form['psc_code'];
        var psc_km_range = form['psc_km_range'];

        if (manufacturer.value === "Select car manufacturer!" || model.value === "Select model!") {
            show_alert_message("You must select car and model to continue!");
            return
        }
        psc_code.value = psc_code.value.trim();

        if (psc_code.value.length > 0 && /^[0-9\s]{5,6}$/.test(psc_code.value) === false) {
            show_alert_message("PSC should be only numbers with optional space and needs to be at least 5 characters!");
            return
        }
        if (psc_code.value.length === 0 && psc_km_range.value.length > 0) {
            show_alert_message("PSC is required when km range is provided!");
            return
        }
        send_form(form);
    }

    function  send_form(form) {
        const form_data_dict = {};
        const telegramUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;

        if (!telegramUserId) {
            show_alert_message("Telegram user is not available.");
            return;
        }

        var form_data = new FormData(form);

        form_data.forEach((value, key) => {
            form_data_dict[key] = value;
        });

        form_data_dict['telegram_user_id'] = telegramUserId;

        fetch("create_search", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(form_data_dict)
        }).then(res => {
            if (res.ok && res.status === 200) {
                return res.json()
            }
            throw new Error('There is unexpected problem on backend, we are looking into this ¯\\_(ツ)_/¯');
        }).then(res => {
            console.log(`This is the responce:`);
            console.log(res);
            if (res['search_created']) {
                window.location.href = `/?new_search_created=true`
            }
            if (!res['search_created']) {
                window.location.href = `/?search_already_exists=true`
            }
        }).catch(err => show_alert_message(String(err)))
    }

</script>

{% endblock %}
